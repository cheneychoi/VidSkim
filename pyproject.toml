[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vidskim"
version = "0.1.0"
description = "把视频变成几分钟能读完的精华。"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx[socks]>=0.28,<1", "faster-whisper>=1.2,<2", "av>=16,<19"]

[project.scripts]
vidskim = "vidskim.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/vidskim"]

[tool.hatch.build.targets.wheel.force-include]
"skills/vidskim/SKILL.md" = "vidskim/data/SKILL.md"
"examples/summary.md" = "vidskim/data/demo.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
